services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hoopsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoopsync}
      POSTGRES_DB: hoopsync
    ports:
      # Bound to localhost only — local dev still reaches it at
      # localhost:5433, but a public deployment never exposes the
      # database to the internet.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoopsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ocr-service:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hoopsync:${POSTGRES_PASSWORD:-hoopsync}@postgres:5432/hoopsync?schema=public
      PORT: 4000
      # Dev-only default — every real deployment must set a real
      # JWT_SECRET (e.g. via the platform's env var settings), never
      # commit one to the repo.
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_EXPIRES_IN: 7d
      OCR_SERVICE_URL: http://ocr-service:8000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-hoopsync}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-hoopsync123}
      MINIO_BUCKET: hoopsync-media
      # The URL the *browser* uses to load uploaded photos — different
      # from MINIO_ENDPOINT above (which is only the backend's internal
      # route to MinIO). A real deployment must point this at MinIO's
      # own public URL.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
    ports:
      - "4000:4000"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hoopsync}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hoopsync123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      # Web console — only useful for local debugging, never routed
      # publicly in a real deployment.
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocr-service:
    build: ./ocr-service
    restart: unless-stopped
    # Not exposed on a host port on purpose (see spec: "the OCR service
    # should preferably not be publicly exposed directly, only the
    # backend should communicate with it") — reachable at
    # http://ocr-service:8000 from inside the Docker network.
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      # Baked into the client bundle at build time (see Dockerfile) —
      # defaults to the backend's host-mapped port for local dev;
      # a real deployment must set this to its own public backend URL.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3010:3000"

volumes:
  postgres_data:
  minio_data:
